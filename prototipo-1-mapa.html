<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>La Perla · Mapa interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141414; --gris: #f4f4f2; --muted: #5c5c5c;
    --naranja: #ff6b2c; --verde: #1fb36b; --rosa: #ff5fa2; --azul: #3d6bff; --amarillo: #ffc31f; --morado: #a259ff;
    --borde: 2px solid var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: #fff; color: var(--ink); font-family: 'Montserrat', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #escena.arrastrando { cursor: grabbing; }

  /* ---------- Barra superior ---------- */
  .barra {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: #fff; border-bottom: var(--borde);
    display: grid; grid-template-columns: auto 1fr auto; align-items: stretch; padding-top: env(safe-area-inset-top);
  }
  .marca { background: var(--ink); color: #fff; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; }
  .marca b { font-weight: 900; letter-spacing: .22em; font-size: 16px; line-height: 1; }
  .marca b sup { font-size: 8px; letter-spacing: 0; }
  .marca small { font-size: 10px; font-weight: 600; opacity: .75; margin-top: 4px; }
  .niveles { display: flex; justify-content: center; align-items: center; gap: 0; padding: 8px; }
  .niveles button {
    border: var(--borde); background: #fff; padding: 8px 14px; font-weight: 900; font-size: 13px; text-transform: uppercase;
    letter-spacing: .04em; margin-left: -2px; display: flex; gap: 8px; align-items: center;
  }
  .niveles button:first-child { margin-left: 0; }
  .niveles button i { width: 12px; height: 12px; border: 2px solid var(--ink); background: var(--c); }
  .niveles button[aria-selected="true"] { background: var(--c); color: var(--t, var(--ink)); }
  .niveles button[aria-selected="true"] i { background: #fff; }
  .acciones { display: flex; border-left: var(--borde); }
  .acciones button { border: 0; border-left: var(--borde); background: #fff; padding: 0 16px; font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .acciones button:first-child { border-left: 0; }
  .acciones button svg { width: 18px; height: 18px; flex: none; }
  .acciones button[aria-pressed="true"] { background: var(--azul); color: #fff; }
  #btnPasaporte { background: var(--amarillo); }

  /* ---------- Etiquetas sobre el mapa ---------- */
  #etiquetas { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .etq {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap;
    background: #fff; border: 1.5px solid var(--ink); font-size: 10.5px; font-weight: 800; padding: 3px 6px 3px 4px;
    display: flex; align-items: center; gap: 4px; box-shadow: 2px 2px 0 var(--ink); will-change: transform; transition: opacity .15s;
  }
  .etq i { width: 8px; height: 8px; border: 1.5px solid var(--ink); background: var(--c); flex: none; }
  .etq.sel { background: var(--amarillo); }
  .pin {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px; will-change: transform;
  }
  .pin .ico { width: 40px; height: 40px; display: grid; place-items: center; background: var(--c); color: var(--t); border: var(--borde); box-shadow: 3px 3px 0 var(--ink); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
  .pin .ico svg { width: 22px; height: 22px; }
  .pin .nom { background: #fff; border: 1.5px solid var(--ink); font-size: 10.5px; font-weight: 900; padding: 2px 6px; text-transform: uppercase; letter-spacing: .02em; }
  .pin .estr { position: absolute; top: -8px; right: -10px; background: var(--amarillo); border: 1.5px solid var(--ink); font-size: 10px; font-weight: 900; padding: 0 4px; }
  .pin:hover .ico, .pin.sel .ico { transform: translateY(-4px) scale(1.08); }
  .pin.objetivo .ico { animation: brinco .7s ease-in-out infinite alternate; }
  @keyframes brinco { to { transform: translateY(-10px); } }

  /* ---------- Controles de cámara ---------- */
  .zoom { position: fixed; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 4; display: flex; flex-direction: column; background: #fff; border: var(--borde); box-shadow: 4px 4px 0 var(--ink); }
  .zoom button { width: 46px; height: 46px; border: 0; background: #fff; font-size: 22px; font-weight: 900; display: grid; place-items: center; }
  .zoom button + button { border-top: var(--borde); }
  .zoom button svg { width: 20px; height: 20px; }
  .ayuda-gestos { position: fixed; left: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 3; background: #fff; border: var(--borde); padding: 8px 10px; font-size: 11px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); transition: opacity .4s; }

  /* ---------- Hoja inferior (ficha) ---------- */
  .hoja {
    position: fixed; z-index: 6; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: min(400px, calc(100vw - 88px));
    background: #fff; border: var(--borde); box-shadow: 6px 6px 0 var(--ink);
    transform: translateY(calc(100% + 40px)); transition: transform .3s cubic-bezier(.2, .9, .3, 1); max-height: calc(100vh - 140px); max-height: calc(100dvh - 140px); overflow: auto;
  }
  .hoja.on { transform: none; }
  .hoja .cerrar { position: absolute; top: 0; right: 0; width: 42px; height: 42px; border: 0; border-left: var(--borde); border-bottom: var(--borde); background: #fff; font-size: 22px; font-weight: 700; z-index: 1; }
  .banda { background: var(--c); color: var(--t); padding: 16px 54px 16px 16px; border-bottom: var(--borde); display: flex; gap: 12px; align-items: center; }
  .banda .ico { flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: #fff; color: var(--ink); border: var(--borde); }
  .banda .ico svg { width: 26px; height: 26px; }
  .eyebrow { margin: 0 0 4px; text-transform: uppercase; letter-spacing: .12em; font-size: 10.5px; font-weight: 800; }
  .banda h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 900; }
  .cuerpo { padding: 14px 16px 16px; }
  .cuerpo p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; font-weight: 500; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; border: var(--borde); margin-bottom: 12px; }
  .stats div { padding: 8px 10px; } .stats div + div { border-left: var(--borde); } .stats div:only-child { grid-column: 1 / -1; }
  .stats small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stats b { font-size: 13px; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .chips li { font-size: 11.5px; font-weight: 700; padding: 5px 9px; border: 1.5px solid var(--ink); background: var(--gris); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: var(--borde); padding: 13px 18px; width: 100%;
    font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; background: var(--amarillo); color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: none; }
  .btn .est { margin-left: auto; letter-spacing: 0; }
  .btn.sec { background: #fff; }

  /* ---------- Paneles (directorio, pasaporte) ---------- */
  .panel { position: fixed; inset: 0; z-index: 8; background: rgba(255, 255, 255, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .panel[hidden] { display: none; }
  .tarjeta { background: #fff; border: var(--borde); box-shadow: 8px 8px 0 var(--ink); width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; animation: entra .3s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } }
  .tarjeta-cab { display: flex; align-items: stretch; border-bottom: var(--borde); }
  .tarjeta-cab div { flex: 1; padding: 14px 16px; background: var(--c); color: var(--t); }
  .tarjeta-cab h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .tarjeta-cab button { border: 0; border-left: var(--borde); background: #fff; width: 52px; font-size: 22px; font-weight: 700; }
  .buscador { padding: 12px 16px; border-bottom: var(--borde); }
  .buscador input { width: 100%; border: var(--borde); padding: 11px 12px; font: 700 15px Montserrat, sans-serif; outline: none; }
  .buscador input:focus { box-shadow: 3px 3px 0 var(--ink); }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: var(--borde); scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex: none; border: 1.5px solid var(--ink); background: #fff; padding: 6px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
  .cats button i { width: 10px; height: 10px; border: 1.5px solid var(--ink); background: var(--c); }
  .cats button.on { background: var(--c); color: var(--t); }
  .lista { overflow: auto; padding: 6px 0; }
  .lista h3 { margin: 10px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
  .lista button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid #e7e7e2; background: #fff; padding: 10px 16px; text-align: left; font-weight: 700; font-size: 14px; }
  .lista button:hover { background: var(--gris); }
  .lista button i { width: 14px; height: 14px; border: 1.5px solid var(--ink); background: var(--c); flex: none; }
  .lista button small { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 700; }
  .vacio { padding: 20px 16px; color: var(--muted); font-weight: 600; }
  .sellos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; border-top: var(--borde); border-left: var(--borde); margin: 14px 16px 16px; overflow: auto; }
  .sello { border: 0; border-right: var(--borde); border-bottom: var(--borde); background: #fff; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
  .sello .ico { width: 34px; height: 34px; border: var(--borde); display: grid; place-items: center; background: var(--c); color: var(--t); }
  .sello .ico svg { width: 20px; height: 20px; }
  .sello b { font-size: 12.5px; font-weight: 900; }
  .sello span { font-size: 15px; letter-spacing: 2px; color: #d0d0cb; }
  .sello span em { font-style: normal; color: var(--ink); }
  .resumen-pas { padding: 12px 16px 0; font-weight: 700; font-size: 14px; }

  /* ---------- Reto ---------- */
  .reto { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(72px + env(safe-area-inset-top)); width: min(520px, calc(100vw - 28px)); background: var(--azul); color: #fff; border: var(--borde); box-shadow: 5px 5px 0 var(--ink); }
  .reto[hidden] { display: none; }
  .reto .fila { display: flex; align-items: stretch; }
  .reto .txt { flex: 1; padding: 10px 14px; }
  .reto .txt small { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  .reto .txt b { display: block; font-size: 17px; font-weight: 900; line-height: 1.25; margin-top: 2px; }
  .reto .pts { background: var(--amarillo); color: var(--ink); border-left: var(--borde); padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 76px; }
  .reto .pts small { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .reto .pts b { font-size: 20px; font-weight: 900; }
  .reto .barra-t { height: 10px; background: #fff; border-top: var(--borde); } .reto .barra-t i { display: block; height: 100%; background: var(--naranja); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 20; background: var(--ink); color: #fff; padding: 11px 16px; font-weight: 800; font-size: 14px; box-shadow: 4px 4px 0 var(--amarillo); transition: .3s; max-width: calc(100vw - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .cargando { position: fixed; inset: 0; z-index: 30; background: #fff; display: grid; place-items: center; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; }
  .cargando .cuadros { display: flex; gap: 6px; margin-bottom: 14px; justify-content: center; }
  .cargando .cuadros i { width: 18px; height: 18px; border: 2px solid var(--ink); animation: cargar 1s ease-in-out infinite alternate; }
  .cargando .cuadros i:nth-child(2) { animation-delay: .15s; } .cargando .cuadros i:nth-child(3) { animation-delay: .3s; } .cargando .cuadros i:nth-child(4) { animation-delay: .45s; }
  @keyframes cargar { to { transform: translateY(-10px); } }

  @media (max-width: 820px) {
    .barra { grid-template-columns: 1fr auto; }
    .marca { padding: 8px 12px; } .marca small { display: none; }
    .niveles { grid-column: 1 / -1; grid-row: 2; border-top: var(--borde); padding: 0; }
    .niveles button { flex: 1; justify-content: center; border-top: 0; border-bottom: 0; padding: 10px 6px; font-size: 12px; }
    .niveles button:first-child { border-left: 0; } .niveles button:last-child { border-right: 0; }
    .acciones button { padding: 0 12px; min-height: 46px; }
    .acciones .txt { display: none; }
    .hoja { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom)); }
    .zoom { right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); }
    .hoja.on ~ .zoom { opacity: 0; pointer-events: none; }
    .reto { top: calc(104px + env(safe-area-inset-top)); }
    .ayuda-gestos { display: none; }
  }
</style>
</head>
<body>
<canvas id="escena" tabindex="0" aria-label="Mapa 3D de La Perla"></canvas>
<div id="etiquetas"></div>

<header class="barra">
  <div class="marca"><b>LA PERLA<sup>®</sup></b><small>Mapa interactivo · Prototipo 1</small></div>
  <nav class="niveles" role="tablist" aria-label="Nivel">
    <button role="tab" data-nivel="0" aria-selected="true" style="--c:var(--naranja)"><i></i>Planta baja</button>
    <button role="tab" data-nivel="1" aria-selected="false" style="--c:var(--verde);--t:#fff"><i></i>Nivel 1</button>
    <button role="tab" data-nivel="2" aria-selected="false" style="--c:var(--morado);--t:#fff"><i></i>Nivel 2</button>
  </nav>
  <div class="acciones">
    <button id="btnBuscar" aria-label="Buscar tienda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span class="txt">Directorio</span></button>
    <button id="btnReto" aria-pressed="false" aria-label="Jugar ¿Dónde está?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M10 8.5a2 2 0 1 1 2.8 1.8c-.6.3-.8.8-.8 1.4M12 14.2v.3"/></svg><span class="txt">¿Dónde está?</span></button>
    <button id="btnPasaporte" aria-label="Pasaporte de estrellas"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg><span id="cuentaEstrellas">0/33</span></button>
  </div>
</header>

<div class="reto" id="reto" hidden>
  <div class="fila"><div class="txt"><small id="retoRonda">Ronda 1/6</small><b id="retoPista">…</b></div><div class="pts"><small>Puntos</small><b id="retoPts">0</b></div></div>
  <div class="barra-t"><i id="retoBarra"></i></div>
</div>

<article class="hoja" id="hoja" aria-live="polite"></article>
<div class="zoom">
  <button id="zMas" aria-label="Acercar">+</button>
  <button id="zMenos" aria-label="Alejar">−</button>
  <button id="zRotar" aria-label="Girar el mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
</div>
<div class="ayuda-gestos" id="ayudaGestos">Arrastra para moverte · rueda o pellizca para acercar · toca un local</div>

<div class="panel" id="panelDirectorio" hidden>
  <div class="tarjeta">
    <div class="tarjeta-cab" style="--c:var(--naranja)"><div><p class="eyebrow">Directorio</p><h2>¿Qué buscas?</h2></div><button data-cerrar aria-label="Cerrar">×</button></div>
    <div class="buscador"><input id="busca" type="search" placeholder="Busca una tienda, restaurante o experiencia…" autocomplete="off"></div>
    <div class="cats" id="cats"></div>
    <div class="lista" id="lista"></div>
  </div>
</div>
<div class="panel" id="panelPasaporte" hidden>
  <div class="tarjeta">
    <div class="tarjeta-cab" style="--c:var(--amarillo)"><div><p class="eyebrow">Pasaporte La Perla</p><h2>Tus estrellas</h2></div><button data-cerrar aria-label="Cerrar">×</button></div>
    <p class="resumen-pas" id="resumenPas"></p>
    <div class="sellos" id="sellos"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="cargando" id="cargando"><div><div class="cuadros"><i style="background:var(--naranja)"></i><i style="background:var(--verde)"></i><i style="background:var(--rosa)"></i><i style="background:var(--azul)"></i></div>Construyendo La Perla…</div></div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script src="datos-zonas.js"></script>
<script type="module">
import * as THREE from 'three';
import { crearPlaza, X, Z, MUNDO } from './escena.js';
import { abrirMinijuego, JUEGOS } from './minijuegos.js';

const D = window.LA_PERLA;
const $ = (id) => document.getElementById(id);
const movil = matchMedia('(pointer: coarse)').matches;
const guardado = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};
const icono = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${D.ICONOS[n]}"/></svg>`;
const JUEGO_POR_CATEGORIA = { moda: 'outfit', comida: 'horapico', deporte: 'tiro' };

/* ======================= Escena y cámara ======================= */
const canvas = $('escena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, movil ? 1.75 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const plaza = crearPlaza(D, { modo: 'iso', movil });
const scene = plaza.scene;
window.__perla = { renderer, scene };
// iOS/Safari: evita el zoom de página con gestos y recupera la escena si el sistema libera la GPU
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); });
canvas.addEventListener('webglcontextrestored', () => location.reload());

scene.background = new THREE.Color('#ffffff');

const VISTA = 70;
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -600, 1200);
const C = { objetivo: new THREE.Vector3(0, 0, 0), zoom: 1, az: -Math.PI / 4, el: THREE.MathUtils.degToRad(42) };
const destino = { objetivo: C.objetivo.clone(), zoom: 1, az: C.az };
let camCambio = true;

function colocarCamara() {
  const d = 400;
  cam.position.set(
    C.objetivo.x + Math.sin(C.az) * Math.cos(C.el) * d,
    C.objetivo.y + Math.sin(C.el) * d,
    C.objetivo.z + Math.cos(C.az) * Math.cos(C.el) * d,
  );
  cam.zoom = C.zoom;
  cam.lookAt(C.objetivo);
  cam.updateProjectionMatrix();
}
function ajustar() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  cam.left = -VISTA * a; cam.right = VISTA * a; cam.top = VISTA; cam.bottom = -VISTA;
  cam.updateProjectionMatrix();
  camCambio = true;
}
addEventListener('resize', ajustar);
ajustar();
const zoomInicial = () => THREE.MathUtils.clamp(Math.min((2 * VISTA * innerWidth / innerHeight) / 330, (2 * VISTA) / 230), .42, 1.4);

const ZMIN = .35, ZMAX = 5;
const lim = { x: 140, z: 130 };
function limitar(v) { v.x = THREE.MathUtils.clamp(v.x, -lim.x, lim.x); v.z = THREE.MathUtils.clamp(v.z, -lim.z, lim.z); return v; }

let nivel = 0;

  nivel = n;

  document.querySelectorAll('.niveles button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.nivel === n)));

}

/* ======================= Etiquetas y pines ======================= */
const capa = $('etiquetas');
let etiquetas = [];
let seleccion = null; // { tipo: 'tienda'|'zona', ref }
const estrellas = guardado.get('laperla-estrellas', {});
const v3 = new THREE.Vector3();

function zonasDelNivel(n) {
  return D.zonas.filter((z) => z.id === 'liverpool' || z.nivel === n);
}
function construirEtiquetas() {
  capa.innerHTML = '';
  etiquetas = [];
  const top = nivel * MUNDO.ALTO_NIVEL + MUNDO.ALTO_LOCAL + 1.2;
  D.NIVELES[nivel].tiendas.forEach((t) => {
    if (!t.nombre || t.nombre === 'Local de comida') return;
    if (D.zonas.some((z) => z.tienda === t.nombre && (z.id !== 'liverpool' || true))) return; // las anclas con juego usan pin
    const el = document.createElement('div');
    el.className = 'etq';
    el.style.setProperty('--c', D.CATEGORIAS[t.cat].color);
    el.innerHTML = `<i></i>${t.nombre}`;
    capa.appendChild(el);
    etiquetas.push({ el, pos: new THREE.Vector3(X(t.centro[0]), top, Z(t.centro[1])), area: t.area, ancho: t.nombre.length * 6.4 + 22, tienda: t, prioridad: 0 });
  });
  zonasDelNivel(nivel).forEach((z) => {
    const el = document.createElement('button');
    el.className = 'pin';
    el.style.setProperty('--c', z.acento); el.style.setProperty('--t', D.tinta(z.acento));
    const e = estrellas[z.juego] || 0;
    el.innerHTML = `<span class="ico">${icono(z.icono)}</span><span class="nom">${z.nombre}</span>${e ? `<span class="estr">${'★'.repeat(e)}</span>` : ''}`;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); seleccionarZona(z); });
    capa.appendChild(el);
    const h = z.id === 'liverpool' ? nivel * MUNDO.ALTO_NIVEL + MUNDO.ALTO_LOCAL + 3 : z.nivel * MUNDO.ALTO_NIVEL + (z.tienda ? MUNDO.ALTO_LOCAL + 3 : 13);
    etiquetas.push({ el, pos: new THREE.Vector3(X(z.pin[0]), h, Z(z.pin[1])), zona: z, prioridad: 1, ancho: 90 });
  });
  camCambio = true;
}
function actualizarEtiquetas() {
  const w = innerWidth, h = innerHeight;
  const ppu = (h / (cam.top - cam.bottom)) * cam.zoom;
  const ocupados = [];
  const orden = etiquetas.slice().sort((a, b) => (b.prioridad - a.prioridad) || ((b.area || 0) - (a.area || 0)));
  orden.forEach((e) => {
    v3.copy(e.pos).project(cam);
    const x = (v3.x + 1) / 2 * w, y = (1 - v3.y) / 2 * h;
    let visible = x > -60 && x < w + 60 && y > 40 && y < h + 40;
    if (visible && e.tienda) {
      const lado = Math.sqrt(e.area) * MUNDO.S * ppu;
      const esSel = seleccion && seleccion.ref === e.tienda;
      visible = esSel || lado > 26 || cam.zoom > 2.6;
      if (visible && !esSel) {
        const r = [x - e.ancho / 2, y - 22, x + e.ancho / 2, y];
        if (ocupados.some((o) => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1])) visible = false;
        else ocupados.push(r);
      }
      e.el.classList.toggle('sel', !!esSel);
    } else if (visible && e.zona) {
      ocupados.push([x - 45, y - 66, x + 45, y]);
    }
    e.el.style.opacity = visible ? 1 : 0;
    e.el.style.pointerEvents = visible && e.zona ? 'auto' : 'none';
    if (visible) e.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  });
}

/* ======================= Gestos: arrastrar, pellizcar, tocar ======================= */
const punteros = new Map();
let gesto = null;
const ray = new THREE.Raycaster();
const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function aSuelo(cx, cy) {
  const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  plano.constant = -C.objetivo.y;
  const p = new THREE.Vector3();
  return ray.ray.intersectPlane(plano, p) ? p : null;
}
canvas.addEventListener('pointerdown', (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (punteros.size === 1) gesto = { tipo: 'arrastre', x0: e.clientX, y0: e.clientY, t0: performance.now(), movio: false, ultimo: aSuelo(e.clientX, e.clientY) };
  else if (punteros.size === 2) {
    const [a, b] = [...punteros.values()];
    gesto = { tipo: 'pellizco', dist: Math.hypot(a.x - b.x, a.y - b.y), zoom: C.zoom, movio: true };
  }
  $('ayudaGestos').style.opacity = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!punteros.has(e.pointerId)) return;
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesto) return;
  if (gesto.tipo === 'arrastre' && punteros.size === 1) {
    if (Math.hypot(e.clientX - gesto.x0, e.clientY - gesto.y0) > 6) { gesto.movio = true; canvas.classList.add('arrastrando'); }
    if (!gesto.movio) return;
    const p = aSuelo(e.clientX, e.clientY);
    if (p && gesto.ultimo) {
      C.objetivo.x += gesto.ultimo.x - p.x; C.objetivo.z += gesto.ultimo.z - p.z;
      limitar(C.objetivo); destino.objetivo.x = C.objetivo.x; destino.objetivo.z = C.objetivo.z;
      colocarCamara();
      gesto.ultimo = aSuelo(e.clientX, e.clientY);
      camCambio = true;
    }
  } else if (gesto.tipo === 'pellizco' && punteros.size === 2) {
    const [a, b] = [...punteros.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    C.zoom = destino.zoom = THREE.MathUtils.clamp(gesto.zoom * d / gesto.dist, ZMIN, ZMAX);
    colocarCamara(); camCambio = true;
  }
});
function soltar(e) {
  punteros.delete(e.pointerId);
  canvas.classList.remove('arrastrando');
  if (gesto && gesto.tipo === 'arrastre' && !gesto.movio && performance.now() - gesto.t0 < 500) tocar(e.clientX, e.clientY);
  if (punteros.size === 1) {
    const [p] = [...punteros.values()];
    gesto = { tipo: 'arrastre', x0: p.x, y0: p.y, t0: 0, movio: true, ultimo: aSuelo(p.x, p.y) };
  } else if (punteros.size === 0) gesto = null;
}
canvas.addEventListener('pointerup', soltar);
canvas.addEventListener('pointercancel', soltar);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const antes = aSuelo(e.clientX, e.clientY);
  C.zoom = destino.zoom = THREE.MathUtils.clamp(C.zoom * Math.exp(-e.deltaY * .0015), ZMIN, ZMAX);
  colocarCamara();
  const despues = aSuelo(e.clientX, e.clientY);
  if (antes && despues) { C.objetivo.x += antes.x - despues.x; C.objetivo.z += antes.z - despues.z; limitar(C.objetivo); destino.objetivo.copy(C.objetivo); colocarCamara(); }
  camCambio = true;
}, { passive: false });
$('zMas').onclick = () => { destino.zoom = Math.min(ZMAX, C.zoom * 1.5); };
$('zMenos').onclick = () => { destino.zoom = Math.max(ZMIN, C.zoom / 1.5); };
$('zRotar').onclick = () => { destino.az = C.az + Math.PI / 2; };

function tocar(cx, cy) {
  const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  const candidatos = plaza.pickables.filter((m) => m.userData.nivel === nivel && m.parent && m.parent.visible);
  const hits = ray.intersectObjects(candidatos, false);
  if (!hits.length) { cerrarHoja(); return; }
  const tiendaHit = hits.find((h) => h.object.userData.tienda);
  const zonaHit = hits.find((h) => h.object.userData.zona);
  const primero = hits[0].object.userData;
  if (reto.activo) { responderReto(primero.tienda ? { tienda: primero.tienda } : { zona: primero.zona }); return; }
  if (primero.zona && (!tiendaHit || hits[0].object === zonaHit.object)) seleccionarZona(primero.zona);
  else if (tiendaHit) seleccionarTienda(tiendaHit.object.userData.tienda);
}

/* ======================= Selección y ficha ======================= */
const hoja = $('hoja');
let mallaSel = null;
// La tienda elegida se muestra como copia a color, un poco más grande, que brinca sobre el edificio
function resaltar(t) {
  if (mallaSel) { mallaSel.visible = false; mallaSel.position.set(0, mallaSel.userData.yBase, 0); mallaSel.scale.set(1, 1, 1); }
  mallaSel = t ? plaza.tiendasMallas.find((m) => m.userData.tienda === t) : null;
  if (!mallaSel) return;
  if (mallaSel.userData.yBase === undefined) mallaSel.userData.yBase = mallaSel.position.y;
  const c = mallaSel.userData.tienda.centro, k = 1.05;
  mallaSel.scale.set(k, 1, k);
  mallaSel.position.x = X(c[0]) * (1 - k); mallaSel.position.z = Z(c[1]) * (1 - k);
  mallaSel.material = mallaSel.userData.mats;
  if (!mallaSel.userData.contorno) { mallaSel.userData.contorno = new THREE.LineSegments(new THREE.EdgesGeometry(mallaSel.geometry, 35), new THREE.LineBasicMaterial({ color: '#141414' })); mallaSel.add(mallaSel.userData.contorno); }
  mallaSel.userData.salto = 0;
  mallaSel.visible = true;
}
function volarA(px, py, n, zoomMin = 1.6) {
  destino.objetivo.set(X(px), n * MUNDO.ALTO_NIVEL * .6, Z(py));
  limitar(destino.objetivo);
  destino.zoom = Math.max(C.zoom, zoomMin);
}
function estrellasHTML(juego) { const e = estrellas[juego] || 0; return `${'★'.repeat(e)}${'☆'.repeat(3 - e)}`; }
function seleccionarTienda(t, volar = false) {
  const zona = D.zonas.find((z) => z.tienda === t.nombre);
  if (zona) return seleccionarZona(zona, volar);
  seleccion = { tipo: 'tienda', ref: t };
  resaltar(t);
  if (volar) { if (t.nivel !== nivel) cambiarNivel(t.nivel); volarA(t.centro[0], t.centro[1], t.nivel); }
  const cat = D.CATEGORIAS[t.cat];
  const juego = JUEGO_POR_CATEGORIA[t.cat];
  hoja.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">×</button>
    <div class="banda" style="--c:${cat.color};--t:${D.tinta(cat.color)}"><span class="ico">${icono('bag')}</span><div><p class="eyebrow">${cat.nombre}</p><h2>${t.nombre}</h2></div></div>
    <div class="cuerpo">
      <div class="stats"><div><small>Ubicación</small><b>${D.NIVELES[t.nivel].nombre}</b></div><div><small>Categoría</small><b>${cat.nombre}</b></div></div>
      ${juego ? `<button class="btn" data-jugar="${juego}" style="background:${cat.color};color:${D.tinta(cat.color)}">▶ Jugar: ${JUEGOS[juego].titulo}<span class="est">${estrellasHTML(juego)}</span></button>` : '<p style="margin:0;color:#5c5c5c">Horarios, promociones y contacto de cada tienda se conectan al directorio oficial en la versión final.</p>'}
    </div>`;
  abrirHoja();
  camCambio = true;
}
function seleccionarZona(z, volar = false) {
  seleccion = { tipo: 'zona', ref: z };
  resaltar(z.tienda ? D.buscarTienda(z.tienda, z.id === 'liverpool' ? nivel : z.nivel) : null);
  const n = z.id === 'liverpool' ? nivel : z.nivel;
  if (volar || n !== nivel) { if (n !== nivel) cambiarNivel(n); volarA(z.pin[0], z.pin[1], n, 1.4); }
  const def = JUEGOS[z.juego];
  hoja.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">×</button>
    <div class="banda" style="--c:${z.acento};--t:${D.tinta(z.acento)}"><span class="ico">${icono(z.icono)}</span><div><p class="eyebrow">${z.categoria}</p><h2>${z.nombre}</h2></div></div>
    <div class="cuerpo">
      <p>${z.desc}</p>
      ${(z.m2 || z.horario) ? `<div class="stats">${z.m2 ? `<div><small>Superficie</small><b>${z.m2}</b></div>` : ''}${z.horario ? `<div><small>Horario</small><b>${z.horario}</b></div>` : ''}</div>` : ''}
      <ul class="chips">${z.datos.map((d) => `<li>${d}</li>`).join('')}</ul>
      <button class="btn" data-jugar="${z.juego}" data-zona="${z.id}">▶ Jugar: ${def.titulo}<span class="est">${estrellasHTML(z.juego)}</span></button>
    </div>`;
  abrirHoja();
  camCambio = true;
}
function abrirHoja() { hoja.classList.add('on'); }
function cerrarHoja() { hoja.classList.remove('on'); seleccion = null; resaltar(null); camCambio = true; }
hoja.addEventListener('click', (e) => {
  if (e.target.closest('.cerrar')) return cerrarHoja();
  const b = e.target.closest('[data-jugar]');
  if (!b) return;
  const juego = b.dataset.jugar;
  const zona = b.dataset.zona ? D.zona(b.dataset.zona) : D.zonas.find((z) => z.juego === juego);

  abrirMinijuego(juego, {
    zona: acento,
    mejor: estrellas[juego] || 0,
    alTerminar: (e) => {
      if (e > (estrellas[juego] || 0)) { estrellas[juego] = e; guardado.set('laperla-estrellas', estrellas); actualizarCuenta(); construirEtiquetas(); if (seleccion) (seleccion.tipo === 'zona' ? seleccionarZona : seleccionarTienda)(seleccion.ref); }
    },
  });
});

let catFiltro = 'todas';
const CATS = [['todas', 'Todo', '#ffffff'], ['experiencias', 'Experiencias', '#ff6b2c'], ...Object.entries(D.CATEGORIAS).filter(([k]) => k !== 'local' && k !== 'ancla').map(([k, v]) => [k, v.nombre, v.color])];
$('cats').innerHTML = CATS.map(([k, n, c]) => `<button data-c="${k}" class="${k === 'todas' ? 'on' : ''}" style="--c:${c};--t:${D.tinta(c)}"><i></i>${n}</button>`).join('');
$('cats').addEventListener('click', (e) => {

const normal = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function pintarLista() {
  const q = normal($('busca').value.trim());
  const html = [];
  if (catFiltro === 'todas' || catFiltro === 'experiencias') {

      const ts = nv.tiendas.filter((t) => t.nombre && t.nombre !== 'Local de comida' && (catFiltro === 'todas' || t.cat === catFiltro) && (!q || normal(t.nombre).includes(q)));

$('busca').addEventListener('input', pintarLista);
$('btnBuscar').onclick = () => { pintarLista(); $('panelDirectorio').hidden = false; if (!movil) setTimeout(() => $('busca').focus(), 50); };
$('lista').addEventListener('click', (e) => {

document.querySelectorAll('.panel').forEach((p) => p.addEventListener('click', (e) => { if (e.target === p || e.target.closest('[data-cerrar]')) p.hidden = true; }));
addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.querySelectorAll('.panel').forEach((p) => { p.hidden = true; }); cerrarHoja(); } });

/* ======================= ¿Dónde está? ======================= */
const reto = { activo: false };
const barajar = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const SEG = 25;
$('btnReto').onclick = () => (reto.activo ? terminarReto(true) : iniciarReto());
function iniciarReto() {
  cerrarHoja();
  Object.assign(reto, { activo: true, rondas: barajar(D.acertijos).slice(0, 6), i: 0, pts: 0, aciertos: 0, bloqueado: false });
  $('btnReto').setAttribute('aria-pressed', 'true');
  $('reto').hidden = false;
  siguienteRonda();
}
function siguienteRonda() {
  if (reto.i >= reto.rondas.length) return terminarReto();
  const r = reto.rondas[reto.i];
  reto.t0 = performance.now(); reto.bloqueado = false;
  $('retoRonda').textContent = `Ronda ${reto.i + 1}/${reto.rondas.length} · ¿Dónde está?`;
  $('retoPista').textContent = r.zona ? r.pista : `${r.tienda} — ${r.pista}`;
  $('retoPts').textContent = reto.pts;
  document.querySelectorAll('.pin').forEach((p) => p.classList.remove('objetivo'));
}
function objetivoDe(r) {
  if (r.zona) { const z = D.zona(r.zona); return { px: z.pin[0], py: z.pin[1], n: z.nivel, nombre: z.nombre }; }
  const t = D.buscarTienda(r.tienda, r.nivel); return { px: t.centro[0], py: t.centro[1], n: t.nivel, nombre: t.nombre, t };
}
function responderReto(hit) {
  if (reto.bloqueado) return;
  const r = reto.rondas[reto.i];
  const ok = r.zona ? hit.zona && hit.zona.id === r.zona : (hit.tienda && hit.tienda.nombre === r.tienda) || (hit.zona && hit.zona.tienda === r.tienda);
  if (!ok) { toast('Ahí no es… ¡sigue buscando! Prueba otro nivel.'); return; }
  const seg = (performance.now() - reto.t0) / 1000;
  const p = 100 + Math.round(Math.max(0, SEG - seg) / SEG * 100);
  reto.pts += p; reto.aciertos++; reto.bloqueado = true;
  const o = objetivoDe(r);
  if (o.t) resaltar(o.t);
  toast(`¡Correcto! +${p} · ${o.nombre}`);
  setTimeout(() => { resaltar(null); reto.i++; siguienteRonda(); }, 1400);
}
function tiempoAgotado() {
  reto.bloqueado = true;
  const o = objetivoDe(reto.rondas[reto.i]);
  if (o.n !== nivel) cambiarNivel(o.n);
  volarA(o.px, o.py, o.n, 1.6);
  if (o.t) resaltar(o.t);
  toast(`Estaba en ${D.NIVELES[o.n].nombre}: ${o.nombre}`);
  setTimeout(() => { resaltar(null); reto.i++; siguienteRonda(); }, 2200);
}
function terminarReto(cancelado = false) {
  reto.activo = false;
  $('btnReto').setAttribute('aria-pressed', 'false');
  $('reto').hidden = true;
  if (cancelado) return;
  const mejor = guardado.get('laperla-reto-mejor', 0);
  if (reto.pts > mejor) guardado.set('laperla-reto-mejor', reto.pts);
  hoja.innerHTML = `<button class="cerrar" aria-label="Cerrar">×</button>
    <div class="banda" style="--c:var(--azul);--t:#fff"><span class="ico">${icono('star')}</span><div><p class="eyebrow">¿Dónde está? · Resultado</p><h2>${reto.pts} puntos</h2></div></div>
    <div class="cuerpo"><p>Encontraste ${reto.aciertos} de ${reto.rondas.length}. ${reto.pts > mejor ? '¡Nuevo récord!' : `Tu récord: ${mejor} puntos.`}</p>
    <button class="btn" id="otraVez" style="background:var(--azul);color:#fff">Jugar otra vez</button></div>`;
  abrirHoja();
  $('otraVez').onclick = iniciarReto;
}

/* ======================= Toast ======================= */
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ======================= Ciclo ======================= */
const reloj = new THREE.Clock();
let tiempo = 0;
function cuadro() {
  const dt = Math.min(reloj.getDelta(), .05);
  tiempo += dt;
  // suavizado de cámara hacia el destino
  const k = 1 - Math.exp(-8 * dt);
  if (C.objetivo.distanceToSquared(destino.objetivo) > 1e-4 || Math.abs(C.zoom - destino.zoom) > 1e-3 || Math.abs(C.az - destino.az) > 1e-3) {
    C.objetivo.lerp(destino.objetivo, k); C.zoom += (destino.zoom - C.zoom) * k; C.az += (destino.az - C.az) * k;
    colocarCamara(); camCambio = true;
  }
  if (mallaSel) {
    mallaSel.userData.salto += dt;
    const y = mallaSel.userData.yBase + 1.2 + Math.sin(mallaSel.userData.salto * 5) * .25;
    mallaSel.position.y = y;
  }
  if (reto.activo && !reto.bloqueado) {
    const s = (performance.now() - reto.t0) / 1000;
    $('retoBarra').style.width = `${Math.max(0, 1 - s / SEG) * 100}%`;
    if (s >= SEG) tiempoAgotado();
  }
  plaza.actualizar(dt, tiempo);
  renderer.render(scene, cam);
  if (camCambio) { actualizarEtiquetas(); camCambio = false; }
  requestAnimationFrame(cuadro);
}
cambiarNivel(0, false);
$('cargando').remove();
requestAnimationFrame(cuadro);
</script>
